<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTracker - Acceso</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify_content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-primary { background-color: #667eea; }
        .btn-primary:hover { background-color: #5a6fd6; }
        .btn-secondary { background-color: #ff4b4b; margin-top: 5px; }
        .btn-secondary:hover { background-color: #e04343; }
        
        .message { margin-top: 15px; font-size: 14px; min-height: 20px;}
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📍 GeoTracker</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        
        <button onclick="handleLogin()" class="btn-primary">Iniciar Sesión</button>
        <button onclick="handleRegister()" class="btn-secondary">Registrarse</button>
        
        <div id="msg" class="message"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api";

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            showMessage("Conectando...", "black");

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage("¡Bienvenido! Redirigiendo...", "green");
                    // Guardamos el usuario en el navegador
                    localStorage.setItem('user_email', data.email);
                    setTimeout(() => {
                        window.location.href = "/dashboard"; // Te manda al mapa
                    }, 1000);
                } else {
                    showMessage(data.message, "red");
                }
            } catch (error) {
                showMessage("Error de conexión con el servidor", "red");
            }
        }

        async function handleRegister() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                showMessage("Llena ambos campos por favor", "red");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage("¡Cuenta creada! Ahora inicia sesión.", "green");
                } else {
                    showMessage("Error: " + data.message, "red");
                }
            } catch (error) {
                showMessage("Error al intentar registrar", "red");
            }
        }

        function showMessage(text, color) {
            const msgDiv = document.getElementById('msg');
            msgDiv.innerText = text;
            msgDiv.style.color = color;
        }
    </script>
</body>
</html>
